[package]
name = "suspicious"
version.workspace = true
description = "Rust review lints for suspicious code and error handling"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
broad_string_error_variant = { path = "broad_string_error_variant", features = ["rlib"] }
collection_bool_result = { path = "collection_bool_result", features = ["rlib"] }
logged_conversion_impl = { path = "logged_conversion_impl", features = ["rlib"] }
string_error_result = { path = "string_error_result", features = ["rlib"] }

dylint_linting.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
