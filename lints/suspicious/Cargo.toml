[package]
name = "suspicious"
version.workspace = true
description = "Rust review lints for suspicious code and error handling"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
broad_string_error_variant = { workspace = true, features = ["rlib"] }
collection_bool_result = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
logged_conversion_impl = { workspace = true, features = ["rlib"] }
string_error_result = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
