[package]
name = "logged_conversion_impl"
version.workspace = true
description = "A lint to check for logging inside standard conversion impls"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
tracing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[[example]]
name = "edge_cases"
path = "ui/edge_cases.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
