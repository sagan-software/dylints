[package]
name = "maintainability"
version.workspace = true
description = "Rust review lints for quantitative maintainability limits"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abc_size = { workspace = true, features = ["rlib"] }
crap_score = { workspace = true, features = ["rlib"] }
cyclomatic_complexity = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
field_usage_cohesion = { workspace = true, features = ["rlib"] }
impl_method_count = { workspace = true, features = ["rlib"] }
many_exit_points = { workspace = true, features = ["rlib"] }
module_dependency_cycle = { workspace = true, features = ["rlib"] }
module_fan_out = { workspace = true, features = ["rlib"] }
npath_complexity = { workspace = true, features = ["rlib"] }
public_surface_size = { workspace = true, features = ["rlib"] }
source_cognitive_complexity = { workspace = true, features = ["rlib"] }
type_method_complexity = { workspace = true, features = ["rlib"] }
[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
