[package]
name = "many_exit_points"
version.workspace = true
description = "A lint to bound explicit and desugared function exits"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
maintainability-support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
