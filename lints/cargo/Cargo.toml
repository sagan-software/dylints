[package]
name = "cargo"
version.workspace = true
description = "Rust review lints for Cargo and Rust project metadata"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dependency_full_semver_versions = { workspace = true, features = ["rlib"] }
dependency_key_order = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
missing_clippy_toml = { workspace = true, features = ["rlib"] }
missing_rust_toolchain_toml = { workspace = true, features = ["rlib"] }
package_lints_section = { workspace = true, features = ["rlib"] }
rust_toolchain_toml = { workspace = true, features = ["rlib"] }
workspace_dependency_versions = { workspace = true, features = ["rlib"] }
workspace_lints_inheritance = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
