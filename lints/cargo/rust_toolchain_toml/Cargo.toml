[package]
name = "rust_toolchain_toml"
version.workspace = true
description = "A lint to check for bare rust-toolchain files"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cargo_support = { package = "cargo-support", path = "../support" }
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../support/dylint" }

[dev-dependencies]
dylint_testing.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
