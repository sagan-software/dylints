[package]
name = "schemars"
version.workspace = true
description = "Rust review lints for Schemars API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
schemars_json_schema_ref_return = { workspace = true, features = ["rlib"] }
schemars_recursive_inline_schema = { workspace = true, features = ["rlib"] }
schemars_redundant_serde_default = { workspace = true, features = ["rlib"] }
schemars_redundant_serde_deny_unknown_fields = { workspace = true, features = ["rlib"] }
schemars_redundant_serde_rename = { workspace = true, features = ["rlib"] }
schemars_redundant_serde_rename_all = { workspace = true, features = ["rlib"] }
schemars_redundant_serde_skip = { workspace = true, features = ["rlib"] }
schemars_redundant_serde_tag = { workspace = true, features = ["rlib"] }
schemars_redundant_serde_transparent = { workspace = true, features = ["rlib"] }
schemars_schema_for_value_json_schema = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
