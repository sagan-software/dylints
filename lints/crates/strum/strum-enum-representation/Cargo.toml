[package]
name = "strum-enum-representation"
version.workspace = true
description = "Checks enum string representations that should use Strum or diverge from Serde"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
heck.workspace = true
serde_support = { package = "serde-support", path = "../../serde/support" }

[dev-dependencies]
dylint_testing.workspace = true
serde.workspace = true
strum.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
