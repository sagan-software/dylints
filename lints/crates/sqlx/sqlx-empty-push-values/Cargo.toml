[package]
name = "sqlx-empty-push-values"
version.workspace = true
description = "Checks panicking SQLx statement push access"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../../support/dylint" }
sqlx_support = { package = "sqlx-support", path = "../support" }

[dev-dependencies]
dylint_testing.workspace = true
sqlx = { package = "sqlx-fixture", path = "../fixture" }

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
