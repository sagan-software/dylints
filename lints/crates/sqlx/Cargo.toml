[package]
name = "sqlx"
version.workspace = true
description = "Rust review lints for SQLx API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
sqlx_assert_sql_safe = { workspace = true, features = ["rlib"] }
sqlx_empty_push_tuples = { workspace = true, features = ["rlib"] }
sqlx_empty_push_values = { workspace = true, features = ["rlib"] }
sqlx_panicking_row_get = { workspace = true, features = ["rlib"] }
sqlx_panicking_statement_column = { workspace = true, features = ["rlib"] }
sqlx_pool_connection_leak = { workspace = true, features = ["rlib"] }
sqlx_query_builder_push_interpolation = { workspace = true, features = ["rlib"] }
sqlx_query_builder_push_unseparated_interpolation = { workspace = true, features = ["rlib"] }
sqlx_unchecked_query_macro = { workspace = true, features = ["rlib"] }
sqlx_zero_max_connections = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
