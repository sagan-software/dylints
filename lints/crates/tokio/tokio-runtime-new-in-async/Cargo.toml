[package]
name = "tokio-runtime-new-in-async"
version.workspace = true
description = "Checks Runtime::new in async code"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
tokio_support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
tokio.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
