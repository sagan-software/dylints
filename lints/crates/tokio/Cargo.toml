[package]
name = "tokio"
version.workspace = true
description = "Rust review lints for Tokio API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
tokio_blocking_call_in_async = { workspace = true, features = ["rlib"] }
tokio_handle_block_on_in_async = { workspace = true, features = ["rlib"] }
tokio_runtime_block_on_in_async = { workspace = true, features = ["rlib"] }
tokio_runtime_new_in_async = { workspace = true, features = ["rlib"] }
tokio_sleep_in_loop = { workspace = true, features = ["rlib"] }
tokio_spawn_blocking_async_closure = { workspace = true, features = ["rlib"] }
tokio_unbounded_channel = { workspace = true, features = ["rlib"] }
tokio_zero_capacity_channel = { workspace = true, features = ["rlib"] }
tokio_zero_duration_interval = { workspace = true, features = ["rlib"] }
tokio_zero_runtime_thread_count = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
