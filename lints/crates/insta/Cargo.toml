[package]
name = "insta"
version.workspace = true
description = "Rust review lints for Insta snapshot API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
insta_allow_empty_glob = { workspace = true, features = ["rlib"] }
insta_binary_snapshot_missing_extension = { workspace = true, features = ["rlib"] }
insta_bind_to_scope_in_async = { workspace = true, features = ["rlib"] }
insta_compact_json_snapshot = { workspace = true, features = ["rlib"] }
insta_content_direct_match = { workspace = true, features = ["rlib"] }
insta_deprecated_assert_display = { workspace = true, features = ["rlib"] }
insta_empty_description = { workspace = true, features = ["rlib"] }
insta_empty_filter_pattern = { workspace = true, features = ["rlib"] }
insta_empty_input_file = { workspace = true, features = ["rlib"] }
insta_empty_snapshot_path = { workspace = true, features = ["rlib"] }
insta_empty_snapshot_suffix = { workspace = true, features = ["rlib"] }
insta_glob_parent_traversal = { workspace = true, features = ["rlib"] }
insta_json_snapshot = { workspace = true, features = ["rlib"] }
insta_no_module_prefix = { workspace = true, features = ["rlib"] }
insta_noop_filter = { workspace = true, features = ["rlib"] }
insta_redundant_content_resolve_inner = { workspace = true, features = ["rlib"] }
insta_settings_bind_future = { workspace = true, features = ["rlib"] }
insta_settings_new = { workspace = true, features = ["rlib"] }
insta_settings_raw_info = { workspace = true, features = ["rlib"] }
insta_snapshot_in_loop = { workspace = true, features = ["rlib"] }
[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
