[package]
name = "insta-json-snapshot"
version.workspace = true
description = "Checks JSON snapshots where Insta recommends YAML for reviewable diffs"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
insta_support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
insta = { workspace = true, features = ["json", "yaml"] }

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
