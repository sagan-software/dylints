[package]
name = "clap"
version.workspace = true
description = "Rust review lints for clap API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap_allow_hyphen_values_without_num_args = { workspace = true, features = ["rlib"] }
clap_allow_negative_numbers_without_num_args = { workspace = true, features = ["rlib"] }
clap_command_with_arguments_option = { workspace = true, features = ["rlib"] }
clap_derive_author_without_help_template = { workspace = true, features = ["rlib"] }
clap_derive_bool_default_true = { workspace = true, features = ["rlib"] }
clap_derive_redundant_action = { workspace = true, features = ["rlib"] }
clap_derive_redundant_value_parser = { workspace = true, features = ["rlib"] }
clap_derive_vec_vec_without_num_args = { workspace = true, features = ["rlib"] }
clap_derive_verbatim_doc_comment_without_doc = { workspace = true, features = ["rlib"] }
clap_external_subcommand_parser_without_external_subcommands = { workspace = true, features = ["rlib"] }
clap_index_on_option = { workspace = true, features = ["rlib"] }
clap_last_option = { workspace = true, features = ["rlib"] }
clap_multicall_no_binary_name = { workspace = true, features = ["rlib"] }
clap_require_equals_without_num_args = { workspace = true, features = ["rlib"] }
clap_required_conditional_conflict = { workspace = true, features = ["rlib"] }
clap_trailing_var_arg_without_num_args = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
