[package]
name = "clap-derive-redundant-value-parser"
version.workspace = true
description = "Checks value parsers already inferred by Clap derive"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap_support = { package = "clap-support", path = "../support" }
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../../support/dylint" }

[dev-dependencies]
clap.workspace = true
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
