[package]
name = "clap-last-option"
version.workspace = true
description = "A lint to check for clap positional-only last settings on options"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap_support.workspace = true
dylint_linting.workspace = true
dylint_support.workspace = true
[dev-dependencies]
clap.workspace = true
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
