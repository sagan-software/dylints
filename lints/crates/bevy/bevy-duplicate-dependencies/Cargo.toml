[package]
name = "bevy-duplicate-dependencies"
version.workspace = true
description = "A lint that checks crates that directly load multiple Bevy facade versions"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy-support.workspace = true
dylint-support.workspace = true
dylint_linting.workspace = true

[dev-dependencies]
bevy.workspace = true
bevy_018.workspace = true
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
