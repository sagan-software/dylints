[package]
name = "bevy-incompatible-msaa"
version.workspace = true
description = "A lint that checks Bevy bundles for incompatible MSAA settings"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy-support.workspace = true
dylint-support.workspace = true
dylint_linting.workspace = true

[dev-dependencies]
dylint_testing.workspace = true

bevy = { workspace = true, features = ["bevy_camera", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "std"] }
[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
