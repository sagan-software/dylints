[package]
name = "bevy-invalid-constant-font-size"
version.workspace = true
description = "A lint to find invalid constant Bevy pixel font sizes"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support = { path = "../../../../support/dylint" }
dylint_linting.workspace = true

[dev-dependencies]
bevy_text.workspace = true
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
