[package]
name = "bevy-mouse-displacement-times-delta"
version.workspace = true
description = "A lint for multiplying mouse displacement by frame delta time"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy-support.workspace = true
dylint-support.workspace = true
dylint_linting.workspace = true

[dev-dependencies]
dylint_testing.workspace = true

bevy = { workspace = true, features = ["mouse", "std"] }
[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
