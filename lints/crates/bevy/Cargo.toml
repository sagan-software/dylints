[package]
name = "bevy"
version.workspace = true
description = "Rust review lints for Bevy API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy_asset_source_after_asset_plugin = { workspace = true, features = ["rlib"] }
bevy_borrowed_reborrowable = { workspace = true, features = ["rlib"] }
bevy_camera_modification_in_fixed_update = { workspace = true, features = ["rlib"] }
bevy_children_mutation_query = { workspace = true, features = ["rlib"] }
bevy_component_field_contention = { workspace = true, features = ["rlib"] }
bevy_conflicting_query_params = { workspace = true, features = ["rlib"] }
bevy_conflicting_resource_params = { workspace = true, features = ["rlib"] }
bevy_continuous_font_size = { workspace = true, features = ["rlib"] }
bevy_continuous_ui_scale = { workspace = true, features = ["rlib"] }
bevy_disallow_fixed_update_schedule = { workspace = true, features = ["rlib"] }
bevy_disallow_update_schedule = { workspace = true, features = ["rlib"] }
bevy_duplicate_dependencies = { workspace = true, features = ["rlib"] }
bevy_duplicate_plugin_addition = { workspace = true, features = ["rlib"] }
bevy_frame_button_edge_in_fixed_update = { workspace = true, features = ["rlib"] }
bevy_global_transform_mutation_query = { workspace = true, features = ["rlib"] }
bevy_incompatible_msaa = { workspace = true, features = ["rlib"] }
bevy_inherited_visibility_mutation_query = { workspace = true, features = ["rlib"] }
bevy_insert_message_resource = { workspace = true, features = ["rlib"] }
bevy_invalid_constant_font_size = { workspace = true, features = ["rlib"] }
bevy_iter_current_update_messages = { workspace = true, features = ["rlib"] }
bevy_large_component = { workspace = true, features = ["rlib"] }
bevy_large_component_change_filter = { workspace = true, features = ["rlib"] }
bevy_load_builder_replaced_guard = { workspace = true, features = ["rlib"] }
bevy_main_return_without_app_exit = { workspace = true, features = ["rlib"] }
bevy_message_presence_without_consumption = { workspace = true, features = ["rlib"] }
bevy_missing_clone_for_unit_component = { workspace = true, features = ["rlib"] }
bevy_missing_copy_for_unit_component = { workspace = true, features = ["rlib"] }
bevy_missing_default_for_unit_component = { workspace = true, features = ["rlib"] }
bevy_missing_reflect = { workspace = true, features = ["rlib"] }
bevy_mouse_displacement_times_delta = { workspace = true, features = ["rlib"] }
bevy_narrow_exclusive_system = { workspace = true, features = ["rlib"] }
bevy_partially_used_query_data = { workspace = true, features = ["rlib"] }
bevy_presence_only_query_fetch = { workspace = true, features = ["rlib"] }
bevy_readonly_system_access = { workspace = true, features = ["rlib"] }
bevy_text_span_with_layout = { workspace = true, features = ["rlib"] }
bevy_time_elapsed_secs_cast_f64 = { workspace = true, features = ["rlib"] }
bevy_unconventional_naming = { workspace = true, features = ["rlib"] }
bevy_unfiltered_entity_access_query = { workspace = true, features = ["rlib"] }
bevy_unit_in_bundle = { workspace = true, features = ["rlib"] }
bevy_wide_query_access = { workspace = true, features = ["rlib"] }
bevy_world_entity = { workspace = true, features = ["rlib"] }
bevy_world_entity_mut = { workspace = true, features = ["rlib"] }
bevy_world_insert_batch = { workspace = true, features = ["rlib"] }
bevy_world_insert_batch_if_new = { workspace = true, features = ["rlib"] }
bevy_world_non_send = { workspace = true, features = ["rlib"] }
bevy_world_non_send_mut = { workspace = true, features = ["rlib"] }
bevy_world_resource = { workspace = true, features = ["rlib"] }
bevy_world_resource_mut = { workspace = true, features = ["rlib"] }
bevy_world_resource_ref = { workspace = true, features = ["rlib"] }
bevy_world_run_schedule = { workspace = true, features = ["rlib"] }
bevy_world_schedule_scope = { workspace = true, features = ["rlib"] }
bevy_zst_query = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
