[package]
name = "bevy-camera-modification-in-fixed-update"
version.workspace = true
description = "A lint that checks camera-mutating systems added to Bevy FixedUpdate"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy-support = { path = "../support" }
dylint-support = { path = "../../../../support/dylint" }
dylint_linting.workspace = true

[dev-dependencies]
bevy_app.workspace = true
bevy_camera.workspace = true
bevy_ecs.workspace = true
bevy_transform.workspace = true
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
