[package]
name = "bevy-text-span-with-layout"
version.workspace = true
description = "A lint that checks Bevy text span bundles for root-only layout"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy-support = { path = "../support" }
dylint-support = { path = "../../../../support/dylint" }
dylint_linting.workspace = true

[dev-dependencies]
bevy_ecs.workspace = true
bevy_sprite.workspace = true
bevy_text.workspace = true
bevy_ui.workspace = true
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
