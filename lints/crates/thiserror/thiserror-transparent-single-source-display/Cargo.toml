[package]
name = "thiserror-transparent-single-source-display"
version.workspace = true
description = "A lint to check for manual thiserror source display forwarding"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../../support/dylint" }

[dev-dependencies]
dylint_testing.workspace = true
thiserror = { workspace = true, features = ["std"] }

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
