[package]
name = "thiserror-named-field-positional-format"
version.workspace = true
description = "Checks positional formatting of named thiserror fields"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
thiserror_support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
thiserror.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
