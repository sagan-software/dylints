[package]
name = "thiserror"
version.workspace = true
description = "Rust review lints for thiserror API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror_named_field_positional_format = { package = "thiserror-named-field-positional-format", path = "thiserror-named-field-positional-format", features = ["rlib"] }
thiserror_no_std_path_display = { package = "thiserror-no-std-path-display", path = "thiserror-no-std-path-display", features = ["rlib"] }
thiserror_raw_field_format = { package = "thiserror-raw-field-format", path = "thiserror-raw-field-format", features = ["rlib"] }
thiserror_redundant_backtrace_attr = { package = "thiserror-redundant-backtrace-attr", path = "thiserror-redundant-backtrace-attr", features = ["rlib"] }
thiserror_redundant_from_source = { package = "thiserror-redundant-from-source", path = "thiserror-redundant-from-source", features = ["rlib"] }
thiserror_redundant_named_source = { package = "thiserror-redundant-named-source", path = "thiserror-redundant-named-source", features = ["rlib"] }
thiserror_self_display_recursion = { package = "thiserror-self-display-recursion", path = "thiserror-self-display-recursion", features = ["rlib"] }
thiserror_source_field_opt_out = { package = "thiserror-source-field-opt-out", path = "thiserror-source-field-opt-out", features = ["rlib"] }
thiserror_transparent_single_source_display = { package = "thiserror-transparent-single-source-display", path = "thiserror-transparent-single-source-display", features = ["rlib"] }
thiserror_tuple_format_positional_ambiguity = { package = "thiserror-tuple-format-positional-ambiguity", path = "thiserror-tuple-format-positional-ambiguity", features = ["rlib"] }

dylint_linting.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
