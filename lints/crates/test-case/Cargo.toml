[package]
name = "test-case"
version.workspace = true
description = "Rust review lints for test-case macro misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
test_case_async_without_test_harness = { workspace = true, features = ["rlib"] }
test_case_constant_match_guard = { workspace = true, features = ["rlib"] }
test_case_empty_description = { workspace = true, features = ["rlib"] }
test_case_empty_ignore_reason = { workspace = true, features = ["rlib"] }
test_case_empty_matrix = { workspace = true, features = ["rlib"] }
test_case_empty_panic_message = { workspace = true, features = ["rlib"] }
test_case_ignore_without_reason = { workspace = true, features = ["rlib"] }
test_case_ignored_matrix = { workspace = true, features = ["rlib"] }
test_case_inconclusive_modifier = { workspace = true, features = ["rlib"] }
test_case_large_suite = { workspace = true, features = ["rlib"] }
test_case_legacy_inconclusive_description = { workspace = true, features = ["rlib"] }
test_case_nonpositive_almost_precision = { workspace = true, features = ["rlib"] }
test_case_panics_without_message = { workspace = true, features = ["rlib"] }
test_case_single_case_matrix = { workspace = true, features = ["rlib"] }
test_case_singleton_contains_in_order = { workspace = true, features = ["rlib"] }
test_case_singleton_matrix_dimension = { workspace = true, features = ["rlib"] }
test_case_unnamed_test_case = { workspace = true, features = ["rlib"] }
test_case_whitespace_ignore_reason = { workspace = true, features = ["rlib"] }
test_case_whitespace_panic_message = { workspace = true, features = ["rlib"] }
test_case_wildcard_match = { workspace = true, features = ["rlib"] }
test_case_with_function_path = { workspace = true, features = ["rlib"] }
[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
