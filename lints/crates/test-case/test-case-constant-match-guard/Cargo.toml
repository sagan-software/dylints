[package]
name = "test-case-constant-match-guard"
version.workspace = true
description = "Checks constant boolean guards in test-case match assertions"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../../support/dylint" }
test_case_support = { package = "test-case-support", path = "../support" }

[dev-dependencies]
dylint_testing.workspace = true
"test-case".workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
