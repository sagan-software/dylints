[package]
name = "test-case-singleton-contains-in-order"
version.workspace = true
description = "Checks singleton contains_in_order expectations in test-case assertions"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
test_case_support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
"test-case".workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
