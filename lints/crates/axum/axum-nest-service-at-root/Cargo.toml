[package]
name = "axum-nest-service-at-root"
version.workspace = true
description = "A lint to check for Axum services nested at the root"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum_support.workspace = true
dylint_linting.workspace = true
dylint_support.workspace = true
[dev-dependencies]
axum.workspace = true
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
