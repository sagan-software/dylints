[package]
name = "axum-route-legacy-colon-capture"
version.workspace = true
description = "A lint to check for Axum 0.7 colon captures"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum_support = { package = "axum-support", path = "../support" }
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../../support/dylint" }

[dev-dependencies]
axum.workspace = true
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
