[package]
name = "axum"
version.workspace = true
description = "Rust review lints for Axum routing API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum_nest_at_root = { workspace = true, features = ["rlib"] }
axum_nest_service_at_root = { workspace = true, features = ["rlib"] }
axum_nest_wildcard_path = { workspace = true, features = ["rlib"] }
axum_route_empty_path = { workspace = true, features = ["rlib"] }
axum_route_layer_on_empty_router = { workspace = true, features = ["rlib"] }
axum_route_legacy_colon_capture = { workspace = true, features = ["rlib"] }
axum_route_legacy_wildcard_capture = { workspace = true, features = ["rlib"] }
axum_route_path_missing_slash = { workspace = true, features = ["rlib"] }
axum_route_service_empty_path = { workspace = true, features = ["rlib"] }
axum_route_service_router = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
