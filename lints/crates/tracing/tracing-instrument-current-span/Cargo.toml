[package]
name = "tracing-instrument-current-span"
version.workspace = true
description = "Checks explicit current-span instrumentation"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
tracing_support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
tracing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
