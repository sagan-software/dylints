[package]
name = "tracing"
version.workspace = true
description = "Rust review lints for tracing API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
tracing_async_block_in_sync_scope = { workspace = true, features = ["rlib"] }
tracing_await_holding_span_guard = { workspace = true, features = ["rlib"] }
tracing_current_span_enter = { workspace = true, features = ["rlib"] }
tracing_current_span_or_current = { workspace = true, features = ["rlib"] }
tracing_direct_record_all = { workspace = true, features = ["rlib"] }
tracing_format_field = { workspace = true, features = ["rlib"] }
tracing_instrument_current_span = { workspace = true, features = ["rlib"] }
tracing_message_interpolation = { workspace = true, features = ["rlib"] }
tracing_none_enter = { workspace = true, features = ["rlib"] }
tracing_none_or_current = { workspace = true, features = ["rlib"] }
tracing_none_record = { workspace = true, features = ["rlib"] }
tracing_redundant_field_assignment = { workspace = true, features = ["rlib"] }
tracing_redundant_in_current_span = { workspace = true, features = ["rlib"] }
tracing_to_string_field = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
