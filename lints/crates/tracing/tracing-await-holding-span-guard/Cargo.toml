[package]
name = "tracing-await-holding-span-guard"
version.workspace = true
description = "A lint to check for tracing span guards held across await points"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
tracing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[[example]]
name = "optimized"
path = "ui/optimized.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
