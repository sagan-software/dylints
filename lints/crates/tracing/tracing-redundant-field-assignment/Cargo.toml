[package]
name = "tracing-redundant-field-assignment"
version.workspace = true
description = "A lint to check for redundant tracing field assignments"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../../support/dylint" }
tracing_support = { package = "tracing-support", path = "../support" }

[dev-dependencies]
dylint_testing.workspace = true
tracing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
