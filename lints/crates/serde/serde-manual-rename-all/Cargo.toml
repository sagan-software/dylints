[package]
name = "serde-manual-rename-all"
version.workspace = true
description = "A lint to check for repeated Serde field renames replaceable by rename_all"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../../support/dylint" }
serde_support = { package = "serde-support", path = "../support" }

[dev-dependencies]
dylint_testing.workspace = true
serde.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
