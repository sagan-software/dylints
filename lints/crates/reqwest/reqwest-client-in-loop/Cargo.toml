[package]
name = "reqwest-client-in-loop"
version.workspace = true
description = "A lint to check for Reqwest client construction in loops"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
reqwest_support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
reqwest.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
