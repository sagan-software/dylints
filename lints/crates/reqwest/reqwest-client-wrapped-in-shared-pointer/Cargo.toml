[package]
name = "reqwest-client-wrapped-in-shared-pointer"
version.workspace = true
description = "A lint to check for Reqwest clients wrapped in Arc or Rc"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../../support/dylint" }
reqwest_support = { package = "reqwest-support", path = "../support" }

[dev-dependencies]
dylint_testing.workspace = true
reqwest.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
