[package]
name = "restriction"
version.workspace = true
description = "Rust review lints for local policy restrictions"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ambiguous_numeric_unit_field = { path = "ambiguous_numeric_unit_field", features = [
    "rlib",
] }
country_string_field = { path = "country_string_field", features = ["rlib"] }
custom_well_known_type = { path = "custom_well_known_type", features = ["rlib"] }
date_string_field = { path = "date_string_field", features = ["rlib"] }
datetime_integer_field = { path = "datetime_integer_field", features = ["rlib"] }
duration_integer_field = { path = "duration_integer_field", features = ["rlib"] }
hardcoded_path = { path = "hardcoded_path", features = ["rlib"] }
http_method_string = { path = "http_method_string", features = ["rlib"] }
insufficient_public_documentation = { path = "insufficient_public_documentation", features = [
    "rlib",
] }
interpolated_logging = { path = "interpolated_logging", features = ["rlib"] }
large_rust_crate = { path = "large_rust_crate", features = ["rlib"] }
large_rust_file = { path = "large_rust_file", features = ["rlib"] }
manual_test_cases = { path = "manual_test_cases", features = [
    "rlib",
] }
many_assertions_in_test = { path = "many_assertions_in_test", features = [
    "rlib",
] }
missing_intent_comments = { path = "missing_intent_comments", features = ["rlib"] }
path_attribute_outside_root = { path = "path_attribute_outside_root", features = [
    "rlib",
] }
path_string_field = { path = "path_string_field", features = ["rlib"] }
public_serde_schema_derive = { path = "public_serde_schema_derive", features = [
    "rlib",
] }
repeated_cfg_gate = { path = "repeated_cfg_gate", features = ["rlib"] }
runtime_env_read = { path = "runtime_env_read", features = ["rlib"] }
secret_raw_type = { path = "secret_raw_type", features = ["rlib"] }
semantic_primitive_type = { path = "semantic_primitive_type", features = ["rlib"] }
struct_update_default = { path = "struct_update_default", features = ["rlib"] }
unnecessary_module_directory = { path = "unnecessary_module_directory", features = [
    "rlib",
] }
unnecessary_public_type = { path = "unnecessary_public_type", features = [
    "rlib",
] }
url_string_field = { path = "url_string_field", features = ["rlib"] }

dylint_linting.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
