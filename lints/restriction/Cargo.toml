[package]
name = "restriction"
version.workspace = true
description = "Rust review lints for local policy restrictions"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ambiguous_numeric_unit_field = { workspace = true, features = ["rlib"] }
country_string_field = { workspace = true, features = ["rlib"] }
custom_well_known_type = { workspace = true, features = ["rlib"] }
date_string_field = { workspace = true, features = ["rlib"] }
datetime_integer_field = { workspace = true, features = ["rlib"] }
duration_integer_field = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
hardcoded_path = { workspace = true, features = ["rlib"] }
http_method_string = { workspace = true, features = ["rlib"] }
insufficient_public_documentation = { workspace = true, features = ["rlib"] }
interpolated_logging = { workspace = true, features = ["rlib"] }
large_rust_crate = { workspace = true, features = ["rlib"] }
large_rust_file = { workspace = true, features = ["rlib"] }
manual_test_cases = { workspace = true, features = ["rlib"] }
many_assertions_in_test = { workspace = true, features = ["rlib"] }
missing_doctest_examples = { workspace = true, features = ["rlib"] }
missing_intent_comments = { workspace = true, features = ["rlib"] }
path_attribute_outside_root = { workspace = true, features = ["rlib"] }
path_string_field = { workspace = true, features = ["rlib"] }
public_serde_schema_derive = { workspace = true, features = ["rlib"] }
repeated_cfg_gate = { workspace = true, features = ["rlib"] }
runtime_env_read = { workspace = true, features = ["rlib"] }
secret_raw_type = { workspace = true, features = ["rlib"] }
semantic_primitive_type = { workspace = true, features = ["rlib"] }
struct_update_default = { workspace = true, features = ["rlib"] }
unnecessary_module_directory = { workspace = true, features = ["rlib"] }
unnecessary_public_type = { workspace = true, features = ["rlib"] }
url_string_field = { workspace = true, features = ["rlib"] }

[dev-dependencies]
dylint_testing.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
