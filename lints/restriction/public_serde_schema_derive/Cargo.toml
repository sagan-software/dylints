[package]
name = "public_serde_schema_derive"
version.workspace = true
description = "A lint to check for public serde DTOs missing a schema derive"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
schemars.workspace = true
serde.workspace = true

[[example]]
name = "schema_dtos"
path = "ui/main.rs"

[[example]]
name = "schema_dtos_edge_cases"
path = "ui/edge_cases.rs"

[[example]]
name = "schema_dtos_no_schema_impl"
path = "ui/no_schema_impl.rs"

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
