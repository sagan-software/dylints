[package]
name = "unnecessary_module_directory"
version.workspace = true
description = "A lint to check for module directories that contain only mod.rs"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
dylint_support = { package = "dylint-support", path = "../../../support/dylint" }

[dev-dependencies]
dylint_testing.workspace = true
tempfile.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
