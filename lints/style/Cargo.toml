[package]
name = "style"
version.workspace = true
description = "Rust review lints for idiomatic style"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ad_hoc_as_ref = { workspace = true, features = ["rlib"] }
ad_hoc_borrow = { workspace = true, features = ["rlib"] }
ad_hoc_default = { workspace = true, features = ["rlib"] }
ad_hoc_display = { workspace = true, features = ["rlib"] }
ad_hoc_from = { workspace = true, features = ["rlib"] }
ad_hoc_from_str = { workspace = true, features = ["rlib"] }
ad_hoc_into_iterator = { workspace = true, features = ["rlib"] }
ad_hoc_iterator = { workspace = true, features = ["rlib"] }
ad_hoc_try_from = { workspace = true, features = ["rlib"] }
bool_name_prefix = { workspace = true, features = ["rlib"] }
doc_attr_comment = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
interleaved_doc_attributes = { workspace = true, features = ["rlib"] }
internal_import_self = { workspace = true, features = ["rlib"] }
manual_debug_impl = { workspace = true, features = ["rlib"] }
manual_default_impl = { workspace = true, features = ["rlib"] }
manual_error_impl = { workspace = true, features = ["rlib"] }
module_type_first = { workspace = true, features = ["rlib"] }
rumdl_doc_comments = { workspace = true, features = ["rlib"] }
top_level_item_line_break = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
