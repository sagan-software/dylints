[package]
name = "correctness"
version.workspace = true
description = "Rust review lints for likely incorrect behavior"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logged_error_continue = { path = "logged_error_continue", features = ["rlib"] }
panic_in_main = { path = "panic_in_main", features = ["rlib"] }

dylint_linting.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
