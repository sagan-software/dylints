[package]
name = "perf"
version.workspace = true
description = "Rust review lints for avoidable performance costs"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
boxed_future_return = { path = "boxed_future_return", features = ["rlib"] }
expensive_as_method = { path = "expensive_as_method", features = ["rlib"] }
expensive_sort_key = { path = "expensive_sort_key", features = ["rlib"] }
owned_input_field_clones = { path = "owned_input_field_clones", features = [
    "rlib",
] }
ownership_at_boundaries = { path = "ownership_at_boundaries", features = [
    "rlib",
] }
vec_front_removal_in_loop = { path = "vec_front_removal_in_loop", features = ["rlib"] }

dylint_linting.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
