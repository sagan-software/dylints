[package]
name = "perf"
version.workspace = true
description = "Rust review lints for avoidable performance costs"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
boxed_future_return = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
expensive_as_method = { workspace = true, features = ["rlib"] }
expensive_sort_key = { workspace = true, features = ["rlib"] }
owned_input_field_clones = { workspace = true, features = ["rlib"] }
ownership_at_boundaries = { workspace = true, features = ["rlib"] }
vec_front_removal_in_loop = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
