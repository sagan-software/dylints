[package]
name = "complexity"
version.workspace = true
description = "Rust review lints for unnecessarily complex code"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
collect_return = { workspace = true, features = ["rlib"] }
complicated_conditional = { workspace = true, features = ["rlib"] }
consecutive_iterator_loops = { workspace = true, features = ["rlib"] }
contains_key_before_any = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
let_some_return_err = { workspace = true, features = ["rlib"] }
manual_adjacent_window_loop = { workspace = true, features = ["rlib"] }
manual_arg_parsing = { workspace = true, features = ["rlib"] }
manual_entry_update = { workspace = true, features = ["rlib"] }
manual_extend_loop = { workspace = true, features = ["rlib"] }
manual_fallible_collect_loop = { workspace = true, features = ["rlib"] }
manual_filter_for_each_loop = { workspace = true, features = ["rlib"] }
manual_filter_map_for_each_loop = { workspace = true, features = ["rlib"] }
manual_iterator_loop = { workspace = true, features = ["rlib"] }
manual_option_take_if = { workspace = true, features = ["rlib"] }
manual_partition_loop = { workspace = true, features = ["rlib"] }
manual_passthrough_inspect = { workspace = true, features = ["rlib"] }
manual_try_for_each_loop = { workspace = true, features = ["rlib"] }
manual_unzip_loop = { workspace = true, features = ["rlib"] }
one_use_predicate_binding = { workspace = true, features = ["rlib"] }
one_use_private_helper = { workspace = true, features = ["rlib"] }
trivial_public_constructor = { workspace = true, features = ["rlib"] }
unnecessary_map_err = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
