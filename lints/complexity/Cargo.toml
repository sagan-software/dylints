[package]
name = "complexity"
version.workspace = true
description = "Rust review lints for unnecessarily complex code"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
collect_return = { path = "collect_return", features = ["rlib"] }
complicated_conditional = { path = "complicated_conditional", features = ["rlib"] }
consecutive_iterator_loops = { path = "consecutive_iterator_loops", features = [
    "rlib",
] }
contains_key_before_any = { path = "contains_key_before_any", features = [
    "rlib",
] }
let_some_return_err = { path = "let_some_return_err", features = ["rlib"] }
manual_adjacent_window_loop = { path = "manual_adjacent_window_loop", features = [
    "rlib",
] }
manual_arg_parsing = { path = "manual_arg_parsing", features = ["rlib"] }
manual_entry_update = { path = "manual_entry_update", features = ["rlib"] }
manual_extend_loop = { path = "manual_extend_loop", features = ["rlib"] }
manual_fallible_collect_loop = { path = "manual_fallible_collect_loop", features = [
    "rlib",
] }
manual_filter_for_each_loop = { path = "manual_filter_for_each_loop", features = [
    "rlib",
] }
manual_filter_map_for_each_loop = { path = "manual_filter_map_for_each_loop", features = [
    "rlib",
] }
manual_iterator_loop = { path = "manual_iterator_loop", features = ["rlib"] }
manual_option_take_if = { path = "manual_option_take_if", features = ["rlib"] }
manual_partition_loop = { path = "manual_partition_loop", features = ["rlib"] }
manual_passthrough_inspect = { path = "manual_passthrough_inspect", features = [
    "rlib",
] }
manual_try_for_each_loop = { path = "manual_try_for_each_loop", features = [
    "rlib",
] }
manual_unzip_loop = { path = "manual_unzip_loop", features = ["rlib"] }
one_use_predicate_binding = { path = "one_use_predicate_binding", features = [
    "rlib",
] }
one_use_private_helper = { path = "one_use_private_helper", features = [
    "rlib",
] }
trivial_public_constructor = { path = "trivial_public_constructor", features = [
    "rlib",
] }
unnecessary_map_err = { path = "unnecessary_map_err", features = ["rlib"] }

dylint_linting.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
