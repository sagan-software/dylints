[package]
name = "sagan-lints"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "All Sagan Dylint groups in one dynamic library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cargo_lints = { workspace = true, features = ["rlib"] }
complexity_lints = { workspace = true, features = ["rlib"] }
correctness_lints = { workspace = true, features = ["rlib"] }
crates_lints = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
maintainability_lints = { workspace = true, features = ["rlib"] }
perf_lints = { workspace = true, features = ["rlib"] }
restriction_lints = { workspace = true, features = ["rlib"] }
style_lints = { workspace = true, features = ["rlib"] }
suspicious_lints = { workspace = true, features = ["rlib"] }

[dev-dependencies]
dylint_testing.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
