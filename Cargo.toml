[workspace]
# Category globs omit the aggregate library source directory `lints/src`.
# Cargo discovers each group's path dependencies as workspace members.
members = ["lints", "lints/[!su]*", "lints/s[tu]*", "lints/crates/[!s]*", "lints/crates/s[ceqt]*", "support", "web", "xtask"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
# Dylint builds Git-selected libraries with the pinned rustc_private toolchain.
# These libraries are distributed through Git tags instead of crates.io.
publish = false

[workspace.dependencies]
interleaved_doc_attributes = { path = "lints/style/interleaved_doc_attributes" }
semver = "1.0.28"
