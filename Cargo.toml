[workspace.lints.rust.unexpected_cfgs]
level     = "warn"
check-cfg = ["cfg(dylint_lib, values(any()))"]

# Dylint 6.0.3 loads only these group libraries. The crates group registers
# every nested crate-specific lint; listing those libraries again duplicates registration.
# https://trailofbits.github.io/dylint/examples/general/
[workspace.metadata.dylint]
libraries = [
  { path = "lints/cargo" },
  { path = "lints/complexity" },
  { path = "lints/correctness" },
  { path = "lints/crates" },
  { path = "lints/maintainability" },
  { path = "lints/perf" },
  { path = "lints/restriction" },
  { path = "lints/style" },
  { path = "lints/suspicious" },
]

# https://doc.rust-lang.org/rustc/lints/listing/index.html
[workspace.lints.rust]
# Warnings. Cargo emits lower priorities first. Groups use -1; individual checks
# use 0, selected overrides use 1, and ABI/attribute restrictions use 2.
absolute-paths-not-starting-with-crate = "warn"
ambiguous-negative-literals            = "warn"
closure-returning-async-block          = "warn"
deprecated-safe-2024                   = "warn"
deref-into-dyn-supertrait              = "warn"
edition-2024-expr-fragment-specifier   = "warn"
elided-lifetimes-in-paths              = "warn"
explicit-outlives-requirements         = "warn"
ffi-unwind-calls                       = "warn"
if-let-rescope                         = "warn"
impl-trait-overcaptures                = "warn"
impl-trait-redundant-captures          = "warn"
keyword-idents-2018                    = "warn"
keyword-idents-2024                    = "warn"
let-underscore-drop                    = "warn"
macro-use-extern-crate        = "warn"
meta-variable-misuse          = "warn"
missing-copy-implementations  = "warn"
missing-debug-implementations = "warn"
missing-docs                  = { level = "warn", priority = 1 }
missing-unsafe-on-extern      = "warn"
non-ascii-idents = "warn"
redundant-imports                            = "warn"
redundant-lifetimes                          = "warn"
rust-2021-incompatible-closure-captures      = "warn"
rust-2021-incompatible-or-patterns           = "warn"
rust-2021-prefixes-incompatible-syntax       = "warn"
rust-2021-prelude-collisions                 = "warn"
rust-2024-guarded-string-incompatible-syntax = "warn"
rust-2024-incompatible-pat                   = "warn"
rust-2024-prelude-collisions                 = "warn"
single-use-lifetimes                         = "warn"
tail-expr-drop-order  = "warn"
trivial-casts         = "warn"
trivial-numeric-casts = "warn"
unit-bindings         = "warn"
unknown-lints         = "warn"
unnameable-types      = "warn"
unreachable-pub            = { level = "warn", priority = 1 }
unsafe-attr-outside-unsafe = "warn"
unsafe-op-in-unsafe-fn     = "warn"
unused-crate-dependencies  = "warn"
unused-extern-crates       = "warn"
unused-import-braces       = "warn"
unused-lifetimes           = "warn"
unused-macro-rules         = "warn"
unused-qualifications      = "warn"
unused-results             = "warn"
variant-size-differences   = "warn"

# Allowances.
# Native linker messages originate in dylint-link and compiler integration.
linker-messages               = "allow"
# Dylint entry points require unsafe export attributes.
unsafe-code                = "allow"
# Lint crates require the pinned compiler-private API.
unstable-features          = "allow"

# Pinned nightly 2026-07-15 requires these opt-in crate features in every target.
# multiple-supertrait-upcastable: feature(multiple_supertrait_upcastable).
# must-not-suspend: feature(must_not_suspend).
# non-exhaustive-omitted-patterns: feature(non_exhaustive_omitted_patterns_lint).
# unqualified-local-imports: feature(unqualified_local_imports).
# supertrait-item-shadowing-definition and supertrait-item-shadowing-usage are unknown
# to this pinned compiler, so requesting either produces unknown_lints warnings.


[workspace.lints.rustdoc]
# Warnings. Cargo emits lower priorities first. Groups use -1; individual checks
# use 0, selected overrides use 1, and ABI/attribute restrictions use 2.
bare_urls                    = "warn"
broken_intra_doc_links       = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags            = "warn"
invalid_rust_codeblocks      = "warn"
private_intra_doc_links      = "warn"
redundant_explicit_links     = "warn"
unescaped_backticks          = "warn"


[workspace.lints.clippy]
# Warnings. Cargo emits lower priorities first. Groups use -1; individual checks
# use 0, selected overrides use 1, and ABI/attribute restrictions use 2.
all = { level = "warn", priority = -1 }
allow_attributes = { level = "warn", priority = 2 }
allow_attributes_without_reason = { level = "warn", priority = 2 }
disallowed_macros               = { level = "warn", priority = 2 }
disallowed_types                = { level = "warn", priority = 2 }
indexing_slicing                = { level = "warn", priority = 2 }
cargo                           = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
cognitive_complexity    = "warn"
correctness = { level = "warn", priority = -1 }
needless_pass_by_value  = "warn"
nursery = { level = "warn", priority = -1 }
missing_const_for_fn    = { level = "warn", priority = 1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
too_many_arguments                 = "warn"
type_complexity                    = "warn"
option_if_let_else                 = "warn"
doc_markdown                       = "warn"
missing_errors_doc                 = "warn"
missing_docs_in_private_items      = { level = "warn", priority = 1 }
missing_panics_doc                 = "warn"
cast_precision_loss                = { level = "warn", priority = 1 }
struct_field_names                 = { level = "warn", priority = 1 }
must_use_candidate                 = "warn"
if_not_else                        = { level = "warn", priority = 1 }
collapsible_if                     = { level = "warn", priority = 1 }
match_same_arms                    = { level = "warn", priority = 1 }
redundant_closure_for_method_calls = { level = "warn", priority = 1 }
let_and_return                     = { level = "warn", priority = 1 }
struct_excessive_bools             = { level = "warn", priority = 1 }
missing_fields_in_debug            = { level = "warn", priority = 1 }
use_self                           = { level = "warn", priority = 1 }
unused_self                        = { level = "warn", priority = 1 }
unnecessary_wraps                  = { level = "warn", priority = 1 }

# Allowances.
# UI cases intentionally compare dependency versions; transitive versions also differ.
multiple_crate_versions = { level = "allow", priority = 1 }
# Dylint uses Rust ABI registration exports.
no_mangle_with_rust_abi = { level = "allow", priority = 2 }
# Borrowing async patterns in UI and support code can produce non-Send futures.
future_not_send = { level = "allow", priority = 1 }
# The current analysis suggests lifetime changes that need semantic review.
significant_drop_tightening        = { level = "allow", priority = 1 }
# Explicit crate visibility documents helper ownership.
redundant_pub_crate                = { level = "allow", priority = 1 }
# Individual restriction checks are enabled selectively.
restriction                        = { level = "allow", priority = -1 }
