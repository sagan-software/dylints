[workspace]
# Workspace crates are direct children of crates; the one-level glob keeps nested UI fixtures isolated.
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.3.3"
edition = "2024"
# Compiler-specific lint libraries are consumed through Dylint Git discovery, not crates.io.
publish = false

[workspace.dependencies]
# Workspace-local dependencies use their Cargo package names as keys.
# The -lints aliases distinguish group libraries from same-named crates.io packages.
abc-size = { path = "crates/abc-size" }
