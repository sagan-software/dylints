[package]
name = "sagan-lints"
version.workspace = true
description = "Sagan's Rust lint runner and Dylint library bundle"
edition.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
axum-lints = { package = "axum", path = "lints/crates/axum", features = ["rlib"] }
bevy-lints = { package = "bevy", path = "lints/crates/bevy", features = ["rlib"] }
cargo-lints = { package = "cargo", path = "lints/cargo", features = ["rlib"] }
clap.workspace = true
clap-lints = { package = "clap", path = "lints/crates/clap", features = ["rlib"] }
complexity-lints = { package = "complexity", path = "lints/complexity", features = ["rlib"] }
correctness-lints = { package = "correctness", path = "lints/correctness", features = ["rlib"] }
crates-lints = { package = "crates", path = "lints/crates", features = ["rlib"] }
dylint-support = { path = "support/dylint", features = ["rlib"] }
insta-lints = { package = "insta", path = "lints/crates/insta", features = ["rlib"] }
maintainability-lints = { package = "maintainability", path = "lints/maintainability", features = ["rlib"] }
perf-lints = { package = "perf", path = "lints/perf", features = ["rlib"] }
reqwest-category-lints = { package = "reqwest-lints", path = "lints/crates/reqwest", features = ["rlib"] }
restriction-lints = { package = "restriction", path = "lints/restriction", features = ["rlib"] }
schemars-lints = { package = "schemars", path = "lints/crates/schemars", features = ["rlib"] }
serde.workspace = true
serde-lints = { package = "serde", path = "lints/crates/serde", features = ["rlib"] }
serde_json.workspace = true
sqlx-lints = { package = "sqlx", path = "lints/crates/sqlx", features = ["rlib"] }
strum.workspace = true
style-lints = { package = "style", path = "lints/style", features = ["rlib"] }
suspicious-lints = { package = "suspicious", path = "lints/suspicious", features = ["rlib"] }
tempfile.workspace = true
test-case-lints = { package = "test-case", path = "lints/crates/test-case", features = ["rlib"] }
thiserror = { workspace = true, features = ["std"] }
thiserror-lints = { package = "thiserror", path = "lints/crates/thiserror", features = ["rlib"] }
tokio-lints = { package = "tokio", path = "lints/crates/tokio", features = ["rlib"] }
tracing-lints = { package = "tracing", path = "lints/crates/tracing", features = ["rlib"] }

[lints]
workspace = true

[workspace]
members = [
  "lints/cargo",
  "lints/cargo/dependency_full_semver_versions",
  "lints/cargo/dependency_key_order",
