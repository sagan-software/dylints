[alias]
xtask = "run --package xtask --"

[build]
# Keep Rust compiler memory predictable on developer machines.
# Override with CARGO_BUILD_JOBS when more memory is available.
jobs = 1

[env]
# Bound in-process test concurrency for the exact `cargo test` gate.
RUST_TEST_THREADS = "1"

# Hundreds of UI harnesses otherwise repeat dependency debug information.
# Opt in with CARGO_PROFILE_DEV_DEBUG=line-tables-only when debugging a lint.
# https://doc.rust-lang.org/cargo/reference/config.html#profile
[profile.dev]
debug = 0
incremental = false

[target.'cfg(all())']
linker = "dylint-link"
