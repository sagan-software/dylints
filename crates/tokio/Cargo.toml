[package]
name = "tokio"
version.workspace = true
description = "Rust review lints for Tokio API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
tokio-blocking-call-in-async = { workspace = true, features = ["rlib"] }
tokio-handle-block-on-in-async = { workspace = true, features = ["rlib"] }
tokio-runtime-block-on-in-async = { workspace = true, features = ["rlib"] }
tokio-runtime-new-in-async = { workspace = true, features = ["rlib"] }
tokio-sleep-in-loop = { workspace = true, features = ["rlib"] }
tokio-spawn-blocking-async-closure = { workspace = true, features = ["rlib"] }
tokio-unbounded-channel = { workspace = true, features = ["rlib"] }
tokio-zero-capacity-channel = { workspace = true, features = ["rlib"] }
tokio-zero-duration-interval = { workspace = true, features = ["rlib"] }
tokio-zero-runtime-thread-count = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
