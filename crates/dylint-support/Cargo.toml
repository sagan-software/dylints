[package]
name = "dylint-support"
version.workspace = true
description = "Documented Dylint declaration helpers for lint crates"
edition.workspace = true
links = "sagan_rustc_private"
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
dylint_linting.workspace = true
proc-macro2 = { workspace = true, features = [
  "span-locations",
], optional = true }
syn = { workspace = true, features = ["full", "visit"], optional = true }

[dev-dependencies]
tempfile.workspace = true
test-case.workspace = true

[features]
# Preserve the helper API for direct consumers; workspace lints opt in as needed.
default = ["rust-file-size"]
rust-file-size = ["dep:proc-macro2", "dep:syn"]
rlib = []

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
