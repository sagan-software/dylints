[package]
name = "serde"
version.workspace = true
description = "Rust review lints for Serde API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
serde-all-fields-default = { workspace = true, features = ["rlib"] }
serde-borrow-redundant-str-bytes = { workspace = true, features = ["rlib"] }
serde-cow-missing-borrow = { workspace = true, features = ["rlib"] }
serde-deserialize-any-portability = { workspace = true, features = ["rlib"] }
serde-expecting-style = { workspace = true, features = ["rlib"] }
serde-fallback-missing-other = { workspace = true, features = ["rlib"] }
serde-flatten-deny-unknown-fields = { workspace = true, features = ["rlib"] }
serde-inert-directional-attr = { workspace = true, features = ["rlib"] }
serde-manual-rename-all = { workspace = true, features = ["rlib"] }
serde-serialize-str-to-string = { workspace = true, features = ["rlib"] }
serde-skip-serializing-roundtrip = { workspace = true, features = ["rlib"] }
serde-skip-serializing-variant-error = { workspace = true, features = ["rlib"] }
serde-untagged-missing-expecting = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
