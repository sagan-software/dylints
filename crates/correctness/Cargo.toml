[package]
name = "correctness"
version.workspace = true
description = "Rust review lints for likely incorrect behavior"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
logged-error-continue = { workspace = true, features = ["rlib"] }
panic-in-main = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
