[package]
name = "clap-required-conditional-conflict"
version.workspace = true
description = "A lint to check for unconditional and conditional clap requirements"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap-support.workspace = true
dylint-support.workspace = true
dylint_linting.workspace = true
[dev-dependencies]
clap.workspace = true
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "clap"
