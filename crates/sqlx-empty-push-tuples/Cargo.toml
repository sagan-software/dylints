[package]
name = "sqlx-empty-push-tuples"
version.workspace = true
description = "Checks panicking SQLx statement push access"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true
sqlx-support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
sqlx.workspace = true
[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "sqlx"
