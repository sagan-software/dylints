[package]
name = "thiserror-redundant-named-source"
version.workspace = true
description = "A lint to check for redundant source attributes on source fields"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true
thiserror-support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
thiserror = { workspace = true, features = ["std"] }

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "thiserror"
