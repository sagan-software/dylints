[package]
name = "insta-bind-to-scope-in-async"
version.workspace = true
description = "Checks Insta scope guards in async code"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true
insta-support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
insta.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[[example]]
name = "phantom-guard-opt0"
path = "ui/phantom_guard_opt0.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "insta"
