[package]
name = "perf"
version.workspace = true
description = "Rust review lints for avoidable performance costs"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
boxed-future-return = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
expensive-as-method = { workspace = true, features = ["rlib"] }
expensive-sort-key = { workspace = true, features = ["rlib"] }
owned-input-field-clones = { workspace = true, features = ["rlib"] }
ownership-at-boundaries = { workspace = true, features = ["rlib"] }
vec-front-removal-in-loop = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
