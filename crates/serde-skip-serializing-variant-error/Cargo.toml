[package]
name = "serde-skip-serializing-variant-error"
version.workspace = true
description = "A lint to check for serde variants that error when serialized"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true
serde-support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
serde.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "serde"
