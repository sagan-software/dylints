[package]
name = "style"
version.workspace = true
description = "Rust review lints for idiomatic style"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ad-hoc-as-ref = { workspace = true, features = ["rlib"] }
ad-hoc-borrow = { workspace = true, features = ["rlib"] }
ad-hoc-default = { workspace = true, features = ["rlib"] }
ad-hoc-display = { workspace = true, features = ["rlib"] }
ad-hoc-from = { workspace = true, features = ["rlib"] }
ad-hoc-from-str = { workspace = true, features = ["rlib"] }
ad-hoc-into-iterator = { workspace = true, features = ["rlib"] }
ad-hoc-iterator = { workspace = true, features = ["rlib"] }
ad-hoc-try-from = { workspace = true, features = ["rlib"] }
bool-name-prefix = { workspace = true, features = ["rlib"] }
doc-attr-comment = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
interleaved-doc-attributes = { workspace = true, features = ["rlib"] }
internal-import-self = { workspace = true, features = ["rlib"] }
manual-debug-impl = { workspace = true, features = ["rlib"] }
manual-default-impl = { workspace = true, features = ["rlib"] }
manual-error-impl = { workspace = true, features = ["rlib"] }
module-type-first = { workspace = true, features = ["rlib"] }
rumdl-doc-comments = { workspace = true, features = ["rlib"] }
top-level-item-line-break = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
