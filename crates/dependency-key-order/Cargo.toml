[package]
name = "dependency-key-order"
version.workspace = true
description = "A lint to check for alphabetically sorted Cargo dependency entries"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cargo-support.workspace = true
dylint-support.workspace = true
dylint_linting.workspace = true
[dev-dependencies]
dylint_testing.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "cargo"
