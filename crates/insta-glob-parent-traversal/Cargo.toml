[package]
name = "insta-glob-parent-traversal"
version.workspace = true
description = "Checks unsupported parent traversal in two-argument Insta glob macros"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true
insta-support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
insta = { workspace = true, features = ["glob"] }

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "insta"
