[package]
name = "test-case-wildcard-match"
version.workspace = true
description = "Checks vacuous wildcard test-case match assertions"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true
test-case-support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
"test-case".workspace = true

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "test-case"
