[package]
name = "sagan-lints"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "All Sagan Dylint groups in one dynamic library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cargo = { workspace = true, features = ["rlib"] }
complexity = { workspace = true, features = ["rlib"] }
correctness = { workspace = true, features = ["rlib"] }
crates = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
maintainability = { workspace = true, features = ["rlib"] }
perf = { workspace = true, features = ["rlib"] }
restriction = { workspace = true, features = ["rlib"] }
style = { workspace = true, features = ["rlib"] }
suspicious = { workspace = true, features = ["rlib"] }

[dev-dependencies]
dylint_testing.workspace = true

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
