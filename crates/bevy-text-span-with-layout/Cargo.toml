[package]
name = "bevy-text-span-with-layout"
version.workspace = true
description = "A lint that checks Bevy text span bundles for root-only layout"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy-support.workspace = true
dylint-support.workspace = true
dylint_linting.workspace = true

[dev-dependencies]
dylint_testing.workspace = true

bevy = { workspace = true, features = [
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "std",
] }
[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "bevy"
