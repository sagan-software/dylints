[package]
name = "bevy-borrowed-reborrowable"
version.workspace = true
description = "A lint that checks mutable references to reborrowable Bevy system parameters"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy-support.workspace = true
dylint-support.workspace = true
dylint_linting.workspace = true

[dev-dependencies]
dylint_testing.workspace = true

bevy = { workspace = true, features = ["std"] }
[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "bevy"
