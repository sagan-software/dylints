[package]
name = "cargo"
version.workspace = true
description = "Rust review lints for Cargo and Rust project metadata"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dependency-full-semver-versions = { workspace = true, features = ["rlib"] }
dependency-key-order = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
missing-clippy-toml = { workspace = true, features = ["rlib"] }
missing-rust-toolchain-toml = { workspace = true, features = ["rlib"] }
package-lints-section = { workspace = true, features = ["rlib"] }
rust-toolchain-toml = { workspace = true, features = ["rlib"] }
workspace-dependency-versions = { workspace = true, features = ["rlib"] }
workspace-lints-inheritance = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
