[package]
name = "thiserror-no-std-path-display"
version.workspace = true
description = "A lint to check for Path formatting with thiserror std disabled"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true
thiserror-support.workspace = true
toml.workspace = true

[dev-dependencies]
dylint_testing.workspace = true
thiserror.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "thiserror"
