[package]
name = "suspicious"
version.workspace = true
description = "Rust review lints for suspicious code and error handling"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
broad-string-error-variant = { workspace = true, features = ["rlib"] }
collection-bool-result = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
logged-conversion-impl = { workspace = true, features = ["rlib"] }
string-error-result = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
