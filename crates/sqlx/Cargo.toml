[package]
name = "sqlx"
version.workspace = true
description = "Rust review lints for SQLx API misuse"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint_linting.workspace = true
sqlx-assert-sql-safe = { workspace = true, features = ["rlib"] }
sqlx-empty-push-tuples = { workspace = true, features = ["rlib"] }
sqlx-empty-push-values = { workspace = true, features = ["rlib"] }
sqlx-panicking-row-get = { workspace = true, features = ["rlib"] }
sqlx-panicking-statement-column = { workspace = true, features = ["rlib"] }
sqlx-pool-connection-leak = { workspace = true, features = ["rlib"] }
sqlx-query-builder-push-interpolation = { workspace = true, features = [
  "rlib",
] }
sqlx-query-builder-push-unseparated-interpolation = { workspace = true, features = [
  "rlib",
] }
sqlx-unchecked-query-macro = { workspace = true, features = ["rlib"] }
sqlx-zero-max-connections = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
