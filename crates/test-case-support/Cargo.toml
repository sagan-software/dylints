[package]
name = "test-case-support"
version.workspace = true
description = "Shared compiler helpers for test-case-specific lints"
edition.workspace = true
publish.workspace = true

[dependencies]
dylint_linting.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["extra-traits", "full", "parsing"] }

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
