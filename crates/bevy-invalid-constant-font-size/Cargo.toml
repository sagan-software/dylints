[package]
name = "bevy-invalid-constant-font-size"
version.workspace = true
description = "A lint to find invalid constant Bevy pixel font sizes"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true

[dev-dependencies]
dylint_testing.workspace = true

bevy = { workspace = true, features = ["bevy_text", "std"] }
[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "bevy"
