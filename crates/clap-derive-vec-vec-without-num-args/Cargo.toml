[package]
name = "clap-derive-vec-vec-without-num-args"
version.workspace = true
description = "Checks grouped Clap derive fields without a value count"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap-support.workspace = true
dylint-support.workspace = true
dylint_linting.workspace = true
[dev-dependencies]
clap = { workspace = true, features = ["unstable-v5"] }
dylint_testing.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "clap"
