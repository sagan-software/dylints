[package]
name = "strum-enum-representation"
version.workspace = true
description = "Checks enum string representations that should use Strum or diverge from Serde"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true
heck.workspace = true
serde-support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
serde.workspace = true
strum.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "strum"
