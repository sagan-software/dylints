[package]
name = "maintainability"
version.workspace = true
description = "Rust review lints for quantitative maintainability limits"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abc-size = { workspace = true, features = ["rlib"] }
crap-score = { workspace = true, features = ["rlib"] }
cyclomatic-complexity = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
field-usage-cohesion = { workspace = true, features = ["rlib"] }
impl-method-count = { workspace = true, features = ["rlib"] }
many-exit-points = { workspace = true, features = ["rlib"] }
module-dependency-cycle = { workspace = true, features = ["rlib"] }
module-fan-out = { workspace = true, features = ["rlib"] }
npath-complexity = { workspace = true, features = ["rlib"] }
public-surface-size = { workspace = true, features = ["rlib"] }
source-cognitive-complexity = { workspace = true, features = ["rlib"] }
type-method-complexity = { workspace = true, features = ["rlib"] }
[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
