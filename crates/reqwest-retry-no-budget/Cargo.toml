[package]
name = "reqwest-retry-no-budget"
version.workspace = true
description = "A lint to check for unbudgeted Reqwest retry policies"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dylint-support.workspace = true
dylint_linting.workspace = true
reqwest-support.workspace = true
[dev-dependencies]
dylint_testing.workspace = true
reqwest.workspace = true

[[example]]
name = "main"
path = "ui/main.rs"
test = false

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
category = "reqwest"
