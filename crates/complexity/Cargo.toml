[package]
name = "complexity"
version.workspace = true
description = "Rust review lints for unnecessarily complex code"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
collect-return = { workspace = true, features = ["rlib"] }
complicated-conditional = { workspace = true, features = ["rlib"] }
consecutive-iterator-loops = { workspace = true, features = ["rlib"] }
contains-key-before-any = { workspace = true, features = ["rlib"] }
dylint_linting.workspace = true
let-some-return-err = { workspace = true, features = ["rlib"] }
manual-adjacent-window-loop = { workspace = true, features = ["rlib"] }
manual-arg-parsing = { workspace = true, features = ["rlib"] }
manual-entry-update = { workspace = true, features = ["rlib"] }
manual-extend-loop = { workspace = true, features = ["rlib"] }
manual-fallible-collect-loop = { workspace = true, features = ["rlib"] }
manual-filter-for-each-loop = { workspace = true, features = ["rlib"] }
manual-filter-map-for-each-loop = { workspace = true, features = ["rlib"] }
manual-iterator-loop = { workspace = true, features = ["rlib"] }
manual-option-take-if = { workspace = true, features = ["rlib"] }
manual-partition-loop = { workspace = true, features = ["rlib"] }
manual-passthrough-inspect = { workspace = true, features = ["rlib"] }
manual-try-for-each-loop = { workspace = true, features = ["rlib"] }
manual-unzip-loop = { workspace = true, features = ["rlib"] }
one-use-predicate-binding = { workspace = true, features = ["rlib"] }
one-use-private-helper = { workspace = true, features = ["rlib"] }
trivial-public-constructor = { workspace = true, features = ["rlib"] }
unnecessary-map-err = { workspace = true, features = ["rlib"] }

[features]
rlib = ["dylint_linting/constituent"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
