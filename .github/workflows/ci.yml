name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  DYLINT_VERSION: 6.0.3

jobs:
  check:
    name: Tests, lints and reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Dylint 6.0.3 upstream caches tools, registry, Git sources, drivers and toolchains.
      # https://github.com/trailofbits/dylint/blob/v6.0.3/.github/workflows/ci.yml
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.dylint_drivers
            ~/.rustup/toolchains
          key: dylint-${{ runner.os }}-${{ env.DYLINT_VERSION }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: dylint-${{ runner.os }}-${{ env.DYLINT_VERSION }}-
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Dylint tools and mdBook
        run: |
          cargo install --locked --version "$DYLINT_VERSION" cargo-dylint dylint-link
          cargo install --locked mdbook
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=dylint-link" >>"$GITHUB_ENV"
      - name: Require a semver increase for the change
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: cargo xtask release --base "$RELEASE_BASE"
        env:
          RELEASE_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --lib --bins --tests -- -D warnings
      - name: Run tests
        run: cargo test --workspace --lib --bins --tests
      # UI and Cargo example fixtures deliberately violate lint contracts.
      - name: Lint ordinary library, binary and integration-test targets
        run: cargo xtask lint
      - name: Measure canonical executable-line coverage
        run: cargo xtask coverage --min-lines 97 -- --workspace --lib --bins --tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: target/coverage/report
      - name: Benchmark independently loadable lints
        run: cargo xtask bench
      - uses: actions/upload-artifact@v7
        with:
          name: benches
          path: target/criterion
      - name: Check documentation and the command guide
        run: |
          cargo test --workspace --doc
          cargo run -p xtask --example help
      - name: Generate catalog, book and reports
        run: cargo xtask site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  nix:
    name: Nix packages and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.1
      - run: nix flake check

  deploy-pages:
    name: Deploy documentation and reports
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: [check, nix]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Tag validated semver and retain maintenance branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [check, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31.11.1
      - name: Use the committed user identity for release tags
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
      - name: Publish the validated version
        run: nix develop -c cargo xtask release --publish
        env:
          GH_TOKEN: ${{ github.token }}
