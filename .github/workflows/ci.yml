name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The workspace links about 280 rustc_private crates; debug info and
  # incremental artifacts would exceed the runner's disk.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  DYLINT_VERSION: 6.0.3

jobs:
  check:
    name: Format, Clippy, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Dylint tools
        run: |
          cargo install --locked --version "$DYLINT_VERSION" cargo-dylint dylint-link
          # Dylint libraries must be linked through dylint-link, which exists only after this step.
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=dylint-link" >>"$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --lib --bins --tests -- -D warnings
      - name: Run tests
        run: cargo test --workspace --lib --bins --tests

  self-lint:
    name: Bundled lints on this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - name: Install Dylint tools
        run: |
          cargo install --locked --version "$DYLINT_VERSION" cargo-dylint dylint-link
          # Dylint libraries must be linked through dylint-link, which exists only after this step.
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=dylint-link" >>"$GITHUB_ENV"
      - name: Build the runner
        run: cargo build --bin sagan-lints
      # Lint library, binary, and test targets. UI example targets are fixtures
      # that exist to trigger lints, so they are excluded.
      - name: Run strict Clippy and the bundled lints
        run: >-
          cargo run --bin sagan-lints -- --repo . --heartbeat-seconds 0
          --use-repo-clippy-config --no-all-targets
          --extra-cargo-arg=--lib --extra-cargo-arg=--bins --extra-cargo-arg=--tests

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - name: Install Dylint tools
        run: |
          cargo install --locked --version "$DYLINT_VERSION" cargo-dylint dylint-link
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=dylint-link" >>"$GITHUB_ENV"
      - name: Validate coverage reporting
        run: bash scripts/coverage_test.sh
      - name: Measure coverage
        run: scripts/coverage.sh --min-lines "$COVERAGE_MIN_LINES" -- --workspace --lib --bins --tests
        env:
          COVERAGE_MIN_LINES: "97"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: target/coverage/report

  pages:
    name: Build the lint catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - name: Install Dylint tools
        run: |
          cargo install --locked --version "$DYLINT_VERSION" cargo-dylint dylint-link
          # Dylint libraries must be linked through dylint-link, which exists only after this step.
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=dylint-link" >>"$GITHUB_ENV"
      - name: List registered lints
        run: |
          scratch="$(mktemp -d)"
          printf '[workspace]\nresolver = "2"\nmembers = []\n' >"$scratch/Cargo.toml"
          git -C "$scratch" init -q
          cargo run --bin sagan-lints -- --repo "$scratch" --list-private-lints >"$RUNNER_TEMP/lints.txt"
      - name: Generate the catalog
        run: cargo run -p sagan-lints-web -- --lint-list "$RUNNER_TEMP/lints.txt" --out-dir public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy-pages:
    name: Deploy the lint catalog
    # Set the repository variable DEPLOY_PAGES to `true` once GitHub Pages is
    # available for this repository (public, or a plan that allows private Pages).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: [check, self-lint, coverage, pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
