name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  DYLINT_VERSION: 6.0.3
  NEXTEST_VERSION: 0.9.143
  MDBOOK_VERSION: 0.5.4

jobs:
  check:
    name: Tests, lints and reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Restore the compiler before rustup can download it again. Tool caches
      # follow tool versions, not workspace-only Cargo.lock version bumps.
      - uses: actions/cache/restore@v5
        id: compiler
        with:
          path: ~/.rustup/toolchains
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache/save@v5
        if: steps.compiler.outputs.cache-hit != 'true'
        with:
          path: ~/.rustup/toolchains
          key: ${{ steps.compiler.outputs.cache-primary-key }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@v5
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/mdbook
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ env.DYLINT_VERSION }}-${{ env.NEXTEST_VERSION }}-${{ env.MDBOOK_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install Dylint tools and mdBook
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version "$DYLINT_VERSION" cargo-dylint dylint-link
          cargo install --locked --version "$NEXTEST_VERSION" cargo-nextest
          cargo install --locked --version "$MDBOOK_VERSION" mdbook
      # Preserve successful tool setup even if a later validation gate fails.
      - uses: actions/cache/save@v5
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/mdbook
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Configure the Dylint linker
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=dylint-link" >>"$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: ~/.dylint_drivers
          key: drivers-${{ runner.os }}-${{ runner.arch }}-${{ env.DYLINT_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Require a semver increase for the change
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: cargo xtask release --base "$RELEASE_BASE"
        env:
          RELEASE_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check development-command contracts
        run: cargo test -p xtask --tests
      - name: Run Clippy
        run: cargo clippy --workspace --lib --bins --tests -- -D warnings -A unknown-lints
      # Nextest runs the ordinary tests once; doctests remain a separate gate.
      - name: Run tests with nextest
        run: cargo nextest run --workspace --lib --bins --tests
      # UI and Cargo example fixtures deliberately violate lint contracts.
      - name: Lint ordinary library, binary and integration-test targets
        run: cargo xtask lint
      - name: Measure canonical executable-line coverage
        run: cargo xtask coverage --min-lines 97 --min-file-lines 90 -- --workspace --lib --bins --tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: target/coverage/report
      # Coverage deliberately starts from a clean instrumented build. Retain
      # reports, but do not upload disposable build outputs in the Cargo cache.
      - name: Discard disposable coverage build artifacts
        if: always()
        run: rm -rf target/coverage/debug target/coverage/objects target/coverage/profiles
      - name: Benchmark independently loadable lints
        run: DYLINT_DRIVER_PATH="$HOME/.dylint_drivers" cargo xtask bench
      - uses: actions/upload-artifact@v7
        with:
          name: benches
          path: target/criterion
      - name: Check documentation and the command guide
        run: |
          cargo test --workspace --doc
          cargo run -p xtask --example help
      - name: Generate catalog, book and reports
        run: cargo xtask site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  nix:
    name: Nix packages and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.1
      - run: nix --accept-flake-config --max-jobs 1 --cores 1 flake check

  deploy-pages:
    name: Deploy documentation and reports
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: [check, nix]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Tag validated semver and retain maintenance branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: [check, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31.11.1
      - name: Use the committed user identity for release tags
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
      - name: Publish the validated version
        run: nix --accept-flake-config develop -c cargo xtask release --publish
        env:
          GH_TOKEN: ${{ github.token }}
