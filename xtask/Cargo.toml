[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Development commands for the Dylint workspace"
default-run = "xtask"

[dependencies]
clap.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
walkdir.workspace = true

[dev-dependencies]
criterion.workspace = true
dylint-support = { workspace = true, features = ["rust-file-size"] }
test-case.workspace = true

[[bench]]
name = "lint_passes"
harness = false

[[bin]]
name = "tool_fixture"
path = "tests/fixtures/tools.rs"
test = false

[lints]
workspace = true
